<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPO Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HPO">
<meta name="theme-color" content="#E6E9E7">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9E7; --panel:#F7F8F7; --ink:#182320; --ink2:#4A5753; --line:#C9CFCC;
  --accent:#F06A1F; --accent-ink:#8C3A0A; --green:#2E5C48; --green-soft:#D7E5DD;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;font-size:17px;line-height:1.3;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{max-width:640px;margin:0 auto;padding:0 14px 96px;position:relative}
.lockbtn{position:absolute;top:calc(8px + env(safe-area-inset-top));right:14px;z-index:5;display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--panel);color:var(--ink2)}
.lockbtn svg{width:12px;height:12px}
.top{padding:18px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-weight:800;font-size:44px;line-height:.95;letter-spacing:-.01em}
.top h1 small{display:block;font-weight:500;font-size:16px;color:var(--ink2);letter-spacing:.01em;margin-top:6px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}

.picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.picker label{display:block;font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.picker select{width:100%;padding:10px 12px;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);font-weight:600;font-size:18px}
.weekstrip{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.weekstrip::-webkit-scrollbar{display:none}
.weekstrip button{flex:0 0 auto;width:44px;height:44px;border-radius:var(--r);background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:17px;position:relative}
.weekstrip button.cur{border-color:var(--ink);background:var(--ink);color:#fff}
.weekstrip button.done::after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.weekstrip .ph{flex:0 0 auto;width:4px;background:var(--line);border-radius:2px;margin:6px 2px}

.block{margin:22px 0 0;border-left:6px solid var(--ink);padding-left:12px}
.block>h2{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--ink2)}
.block>h2 b{color:var(--ink);font-size:20px;margin-right:6px}
.ex{background:var(--panel);border-radius:var(--r);padding:12px 12px 10px;margin:10px 0}
.ex h3{margin:0;font-size:20px;font-weight:700;line-height:1.1}
.ex .sub{color:var(--ink2);font-size:14px;margin:4px 0 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ex .sub .pr{color:var(--accent-ink);font-weight:700}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:6px;align-items:center}
.sets .h{font-size:12px;font-weight:600;color:var(--ink2);padding-bottom:2px}
.sets .n{font-weight:700;color:var(--ink2)}
.sets input{width:100%;padding:9px 8px;border:2px solid var(--line);border-radius:var(--r);background:#fff;font-size:20px;font-weight:600;text-align:center}
.sets input:disabled{background:var(--bg);border-style:dashed}
.sets .tick{width:44px;height:44px;border-radius:var(--r);border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;color:transparent}
.sets .tick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.target{font-size:13px;color:var(--ink2);grid-column:1/-1;margin-top:-2px}
.prep{margin:12px 0}
.prep summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
.prep summary::after{content:"+";font-size:22px;font-weight:600}
.prep[open] summary::after{content:"–"}
.prep .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:15px}
.prep h4{margin:0 0 4px;font-size:14px;color:var(--ink2)}
.prep ul{margin:0;padding-left:16px}
.prep li{margin:2px 0}
.notes{width:100%;padding:10px;border:2px solid var(--line);border-radius:var(--r);background:#fff;font:inherit;min-height:60px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:var(--r);font-weight:700;font-size:18px;background:var(--ink);color:#fff;width:100%;margin-top:16px}
.btn.done{background:var(--accent)}
.btn.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line);font-size:16px;padding:11px 14px;width:auto;margin-top:0}
.btn.danger{background:#B3261E}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;padding:8px 2px;font-weight:700;font-size:14px;color:var(--ink2);border-radius:var(--r)}
.tabs button.on{color:var(--ink);background:var(--bg)}

.prlist{margin-top:10px}
.prcard{background:var(--panel);border-radius:var(--r);padding:12px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.prcard h3{margin:0;font-size:18px;font-weight:700;grid-column:1/-1}
.prcard .k{font-size:14px;color:var(--ink2)}
.prcard .v{font-size:22px;font-weight:800;text-align:right}
.prcard .v small{font-size:13px;font-weight:600;color:var(--ink2)}
.big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.02em}
.stat{background:var(--panel);border-radius:var(--r);padding:14px;flex:1;min-width:120px}
.stat .k{font-size:13px;color:var(--ink2);font-weight:600}
canvas{width:100%;height:220px;background:var(--panel);border-radius:var(--r);display:block;margin-top:10px}
.empty{color:var(--ink2);padding:24px 0;font-size:16px}
.run{background:var(--panel);border-radius:var(--r);padding:12px;margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:start}
.run .tick{width:44px;height:44px;border-radius:var(--r);border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;color:transparent}
.run .tick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.run h3{margin:0;font-size:18px;font-weight:700}
.run .kind{font-size:13px;font-weight:700;color:var(--green);margin-top:2px}
.run .fields{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.run input{padding:8px;border:2px solid var(--line);border-radius:var(--r);background:#fff;font-size:17px;font-weight:600;width:100%}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px;background:var(--panel);border-radius:var(--r)}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:700;color:var(--ink2);font-size:13px}
tr.me{background:var(--green-soft);font-weight:700}
h2.sec{font-size:22px;font-weight:800;margin:22px 0 6px}
p.help{color:var(--ink2);font-size:15px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
textarea.io{width:100%;min-height:90px;font:13px monospace;border:2px solid var(--line);border-radius:var(--r);padding:8px}

.gate{position:fixed;inset:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:99;font-family:inherit}
.gate h1{font-size:40px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.gate p{color:#B9C3BF;margin:0 0 20px}
.gate input{width:100%;max-width:320px;padding:14px;border-radius:6px;border:2px solid #4A5753;background:#fff;color:var(--ink);font-size:20px;font-weight:600;text-align:center}
.gate button{margin-top:12px;width:100%;max-width:320px;padding:14px;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;font-size:18px}
.gate .err{color:#F06A1F;margin-top:10px;font-weight:700;min-height:22px}

.tbar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;border-radius:var(--r);padding:10px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tbar .t{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tbar .s{font-size:13px;color:#B9C3BF;font-weight:600}
.tbar .s b{color:var(--accent);font-size:15px}
.segbtn{border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:#fff;color:var(--ink);white-space:nowrap}
.segbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.segbtn.done{background:var(--bg);color:var(--ink2)}
.block>h2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prep summary{align-items:center;gap:8px}
.prep summary .segbtn{margin-left:auto}
.split{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px;background:var(--panel);border-radius:var(--r);padding:10px 12px;margin:10px 0}
.split b{font-variant-numeric:tabular-nums}

.exhead{background:var(--panel);border-radius:var(--r);padding:8px 12px;margin:10px 0 6px}
.exh{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.exh:last-child{border-bottom:0}
.exh>b{color:var(--accent-ink);font-size:16px;min-width:16px}
.exh .nm{display:block;font-weight:700;font-size:17px;line-height:1.1}
.exh .tg{display:block;font-size:13px;color:var(--ink2)}
.exh i{color:var(--accent-ink);font-style:normal;font-weight:700}
.round{background:var(--panel);border-radius:var(--r);padding:8px 10px 6px;margin:6px 0}
.rh{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.rrow{display:grid;grid-template-columns:18px 1fr 64px 64px 44px;gap:6px;align-items:center;margin:4px 0}
.rrow .n{font-weight:800;color:var(--accent-ink)}
.rrow .nm{font-weight:600;font-size:15px;line-height:1.05;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rrow input{width:100%;padding:9px 4px;border:2px solid var(--line);border-radius:var(--r);background:#fff;font-size:18px;font-weight:600;text-align:center}
.rrow input:disabled{background:var(--bg);border-style:dashed}
.rrow .tick{width:44px;height:44px;border-radius:var(--r);border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;color:transparent}
.rrow .tick.on{background:var(--accent);border-color:var(--accent);color:#fff}

.ubtn{display:inline-block;vertical-align:middle;border:2px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;background:#fff;color:var(--ink2);margin-left:4px}
.ubtn.band{border-style:dashed;color:var(--green)}
.rrow.bandrow{grid-template-columns:18px 1fr 96px 54px 44px}
.rrow.bandrow input[type=text]{font-size:14px;text-align:left;padding:9px 6px}

.home{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;padding-bottom:40px;padding-top:calc(44px + env(safe-area-inset-top))}
.motto{font-size:72px;line-height:.9;font-weight:800;letter-spacing:-.03em;margin:0 0 28px;text-transform:uppercase;color:var(--ink)}
.motto::after{content:"";display:block;width:80px;height:8px;background:var(--accent);margin-top:18px}
.home .sub{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.pcard{display:block;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;margin:8px 0}
.pcard .pn{display:block;font-size:24px;font-weight:800;line-height:1}
.pcard .pd{display:block;font-size:14px;color:#B9C3BF;margin:6px 0 12px}
.pcard .bar{display:block;height:6px;background:#3A4642;border-radius:3px;overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--accent)}
.pcard .pm{display:block;font-size:13px;color:#B9C3BF;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.pcard .pnx{display:block;font-size:16px;font-weight:800;color:var(--accent)}

.htype{font-size:22px;font-weight:800;margin:6px 0 4px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.02em}
.hblk{margin:6px 0 10px}
.hh{font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px}
.hl{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:var(--r);background:#fff;border:2px solid var(--line);margin:3px 0;font-size:16px;font-weight:600;line-height:1.15}
.hl em{font-style:normal;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.hl.rx em{background:var(--ink);color:#fff}
.hl.rxp{border-color:var(--accent)} .hl.rxp em{background:var(--accent);color:#fff}
.hl.scaled{border-style:dashed} .hl.scaled em{background:var(--green-soft);color:var(--green)}
.hl:disabled{color:var(--ink)} .hl:disabled em{display:none}
.hlog{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.hlog label{display:block;font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.hlog input{width:100%;padding:10px;border:2px solid var(--line);border-radius:var(--r);background:#fff;font-size:20px;font-weight:700}
.weekstrip button.rest{opacity:.45}

.calc{display:inline-block;margin-left:8px;font-size:13px;font-weight:800;color:var(--accent-ink);background:#FDE7DA;border-radius:999px;padding:1px 8px;white-space:nowrap}
.calc.miss{background:var(--bg);color:var(--ink2);font-weight:700}
.maxes{background:var(--panel);border:2px dashed var(--line);border-radius:var(--r);padding:8px 10px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.maxes .mh{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.maxes label{display:grid;grid-template-columns:1fr 76px;align-items:center;gap:6px;font-size:14px;font-weight:600}
.maxes input{width:100%;padding:7px 6px;border:2px solid var(--line);border-radius:var(--r);background:#fff;font-size:17px;font-weight:700;text-align:center}

.hlrow{display:grid;grid-template-columns:1fr 36px;gap:4px;align-items:stretch}
.hlrow .hl{margin:3px 0}
.info{border:2px solid var(--line);border-radius:var(--r);background:#fff;font-weight:800;color:var(--ink2);margin:3px 0;font-size:16px}
.sheet{position:fixed;inset:0;background:rgba(24,35,32,.55);display:none;align-items:flex-end;z-index:50}
.sheet.open{display:flex}
.sh{background:var(--panel);width:100%;max-width:640px;margin:0 auto;border-radius:12px 12px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sh h3{margin:0 0 6px;font-size:24px;font-weight:800}
.sh p{margin:0 0 14px;font-size:16px;line-height:1.35}
.sh .btn.ghost{display:inline-flex;text-decoration:none;margin-right:6px}
.gl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.gl b{font-size:16px} .gl span{grid-column:1;color:var(--ink2)} .gl a{grid-row:1/3;align-self:center;font-weight:800;color:var(--accent-ink);text-decoration:none}

.oneRM{display:grid;grid-template-columns:1fr 96px;gap:2px 8px;align-items:center;background:#FDE7DA;border-radius:var(--r);padding:8px 10px;margin:2px 0 6px}
.oneRM span{font-weight:800;font-size:14px;color:var(--accent-ink)}
.oneRM input{width:100%;padding:8px 6px;border:2px solid var(--accent);border-radius:var(--r);background:#fff;font-size:18px;font-weight:800;text-align:center}
.oneRM small{grid-column:1/-1;color:var(--ink2);font-size:12px}
.maxes i{font-style:normal;font-size:11px;color:var(--accent-ink);font-weight:800}

.install{margin-top:34px;max-width:320px;width:100%;border-top:1px solid #3A4642;padding-top:16px;font-size:14px;color:#B9C3BF;display:grid;gap:8px}
.install b{color:#fff;font-size:15px}
.install i{font-style:normal;font-weight:800;color:var(--accent);margin-right:6px}

.paingrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.pain{padding:12px 6px;border-radius:var(--r);background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:15px}
.pain.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lnote{background:var(--ink);color:#fff;border-radius:var(--r);padding:12px;margin:12px 0 4px}
.lnote b{font-size:20px;display:block;margin-bottom:4px}
.lnote p{margin:0;color:#B9C3BF;font-size:15px}
.lmob .lhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lmob .tick{width:44px;height:44px;border-radius:var(--r);border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;color:transparent;flex:0 0 auto}
.lmob .tick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lmob.ldone{border-left:6px solid var(--accent)}
.lhow{margin:4px 0 10px;font-size:15px;line-height:1.35}
.btn.lrun{background:var(--accent);color:#fff;border-color:var(--accent);font-variant-numeric:tabular-nums}
.limp{font-size:13px;font-weight:700;color:var(--green);margin:-2px 0 4px}
.segbtn.pg{border-style:dashed;color:var(--ink2)} a.segbtn{text-decoration:none;display:inline-flex;align-items:center}

.hl.plain{background:transparent;border-color:transparent;padding-left:2px;font-weight:600}
.nev{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px}
.hl.rxp .nev{color:var(--accent-ink)} .hl.scaled .nev{color:var(--green)}
.netest{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.netest label{display:grid;gap:4px;font-size:13px;color:var(--ink2);font-weight:600}
.netest label i{display:block;font-style:normal;color:var(--accent-ink);font-weight:800}
.netest input{width:100%;padding:10px;border:2px solid var(--line);border-radius:var(--r);background:#fff;font-size:22px;font-weight:800;text-align:center}

.tmw{background:var(--ink);color:#fff;border-radius:var(--r);padding:12px 14px;margin:10px 0}
.tmw.prep.on{background:#2A3340} .tmw.prep .tmbig{color:var(--accent)} .tmw.work.on{background:#1F3A2E} .tmw.rest.on{background:#3A2A1F} .tmw.warm.on{background:#2A3340} .tmw.fin{background:var(--accent)}
.tmrow{display:flex;justify-content:space-between;font-size:13px;color:#B9C3BF;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tmrow b{color:#fff;font-size:16px;font-variant-numeric:tabular-nums}
.tmmain{text-align:center;padding:8px 0 6px}
.tmr{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;min-height:16px}
.tmfin .tmr{color:#fff}
.tmbig{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0}
.tml{font-size:18px;font-weight:700;line-height:1.15;margin-top:4px}
.tmn{font-size:13px;color:#B9C3BF;margin-top:6px;min-height:16px}

// all logged sets for an exercise name across all sessions, newest first

  const out=[];
  for(const k in S.sessions){ const ss=S.sessions[k]; const [p,w,d]=k.split('|'); const week=+w.slice(1), day=+d.slice(1);
    const list=exList(p,week,day); list.forEach((blk,bi)=>blk.forEach((ex,ei)=>{ if(ex.n!==name) return; const sets=(ss.sets[bi+'-'+ei]||[]).filter(s=>s&&(s.w||s.r)); if(sets.length) out.push({date:ss.date||'',week,day,plan:p,sets,pat:ex.p}); })); }
  out.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.week-a.week);

}

function curSeg(){ const t=tm(); return t&&!t.end? t.segs.find(x=>!x.end):null; }
function segDur(name){ const t=tm(); if(!t) return 0; return t.segs.filter(x=>x.name===name).reduce((a,x)=>a+((x.end||Date.now())-x.start),0); }

function hNext(){ for(let m=1;m<=4;m++) for(let d=1;d<=28;d++){ const t=hType(m,d); if(t.c==='rest') continue; if(!hDay(m,d)?.done) return {m,d}; } return {m:4,d:28}; }

function hOptions(t){ let o=H_WORKOUTS.filter(w=>w.c===t.c); if(t.sub&&o.some(w=>w.sub===t.sub)) { const pref=o.filter(w=>w.sub===t.sub), rest=o.filter(w=>w.sub!==t.sub); o=pref.concat(rest); } return o; }
function hFind(n){ return H_WORKOUTS.find(w=>w.n===n); }
function hUsed(n){ return Object.values(S.h.days).filter(x=>x.wo===n&&x.done).length; }
function hHistory(n){ const out=[]; for(const k in S.h.days){ const x=S.h.days[k]; if(x.wo===n&&x.done) out.push(Object.assign({k},x)); } return out.sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }
function tSec(t){ const m=String(t||'').match(/^(\d+):(\d\d)$/); return m?+m[1]*60+ +m[2]:null; }
function hBest(n){ const h=hHistory(n); if(!h.length) return null; const times=h.filter(x=>tSec(x.time)!=null).sort((a,b)=>tSec(a.time)-tSec(b.time)); const scores=h.filter(x=>x.score!==''&&x.score!=null&&!isNaN(+x.score)).sort((a,b)=>+b.score-+a.score); return {time:times[0],score:scores[0],n:h.length,last:h[0]}; }

function hCalc(txt){ // returns html chip for computed loads, or ''
  const bw=/\bBW\b/.test(txt), lift=bw?null:hLift(txt), base=bw?S.bw:(lift?hBase(lift):null);
  const outs=[]; const pct=[...txt.matchAll(/(\d+)(?:-(\d+))?%/g)]; const mult=[...txt.matchAll(/(\d*\.?\d+)x BW/gi)];
  if(!pct.length&&!mult.length&&!/@ BW\b/.test(txt)) return '';
  if(!base) return `<span class="calc miss">${bw?'set bodyweight':lift?'set 1RM '+lift:'1RM?'}</span>`;
  pct.forEach(m=>outs.push(m[2]?`${r5(base*m[1]/100)}-${r5(base*m[2]/100)}`:`${r5(base*m[1]/100)}`));
  mult.forEach(m=>outs.push(`${r5(base*+m[1])}`));
  if(/@ BW\b/.test(txt)) outs.push(`${r5(base)}`);
  return `<span class="calc">= ${outs.join(' · ')}#</span>`; }
function hMaxPanel(w){ // inputs for every lift referenced by %/1RM in this workout, plus BW if used

  if(bw) h+=`<label><span>Bodyweight</span><input type="number" inputmode="decimal" value="${S.bw??''}" placeholder="lb" onchange="hSetBW(this.value)"></label>`;
  return h+'</div>'; }

  const sheet=document.getElementById('sheet'); sheet.innerHTML=`<div class="sh"><h3>${esc(g?g.name:term)}</h3><p>${g?esc(g.def):'No written definition for this one — the video search below shows it.'}</p><a class="btn ghost" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q}">▶ Watch on YouTube</a> <a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}">Search</a><button class="btn" style="margin-top:12px" onclick="document.getElementById('sheet').classList.remove('open')">Close</button></div>`; sheet.classList.add('open'); }

function hCycle(idx){ const x=hEnsure(S.h.m,S.h.d); x.ov=x.ov||{}; const cur=x.ov[idx]||x.scale||'rx'; const i=SCALES.findIndex(z=>z[0]===cur); x.ov[idx]=SCALES[(i+1)%3][0]; save(); render(); }

      if(/work up to 1rm|^1rm |max rep test|^max /i.test(txt)&&hLift(txt)&&ov!==null){ const lift=hLift(txt), x=hDay(S.h.m,S.h.d)||{}, today=x.m1rm&&x.m1rm[lift]; h+=`<div class="oneRM"><span>Today's 1RM ${esc(lift)}</span><input type="number" inputmode="decimal" value="${today??''}" placeholder="${hMax(lift)?hMax(lift)+' on file':'lb'}" onchange="hSet1RM('${lift}',this.value)"><small>${today?'saved to your maxes':hMax(lift)?`using ${hMax(lift)}# (${hMaxSrc(lift)==='est'?'estimated from lifting log':'tested'})`:'enter it and the % lines below update'}</small></div>`; } }); h+='</div>'; }); return h; }
function hStrip(){ const m=S.h.m; let h='<div class="weekstrip">'; for(let d=1;d<=28;d++){ const t=hType(m,d), x=hDay(m,d); const cls=t.c==='rest'?'rest':''; h+=`<button class="${d===S.h.d?'cur':''} ${x?.done?'done':''} ${cls}" onclick="S.h.d=${d};save();render()">${d}</button>`; } return h+'</div>'; }

function gTabata(a,b){ const o=[]; for(let i=0;i<8;i++){ o.push(GS(b&&i%2?b:a,20,'work',`${i+1} / 8`)); if(i<7) o.push(GS('Rest',10,'rest',`${i+1} / 8`)); } return o; }
function gOnOff(n,on,off,label){ const o=[]; for(let i=0;i<n;i++){ o.push(GS(label,on,'work',`${i+1} / ${n}`)); if(i<n-1) o.push(GS('Rest',off,'rest',`${i+1} / ${n}`)); } return o; }

function gSecs(t){ const m=String(t).match(/(\d+):(\d\d)/); if(m) return +m[1]*60+ +m[2]; const mm=String(t).match(/(\d+(?:\.\d+)?)\s*min/i); if(mm) return Math.round(+mm[1]*60); const ss=String(t).match(/(\d+)\s*s(?:ec)?\b/i); if(ss) return +ss[1]; return null; }
// ---- 4 Horsemen: build segments from a workout's headers + lines
function hSegsForBlock(hdr,lines){ const H=hdr||''; const lab=lines.join(' · ')||H; let m;
  if((m=H.match(/every\s+(\d+)\s*sec(?:ond)?s?\s+for\s+(\d+)\s*rounds?/i))) return gEmom(+m[2],+m[1],[lab],'Round');
  if((m=H.match(/every\s+(\d+)\s*min(?:ute)?s?\s+for\s+(\d+)\s*rounds?/i))) return gEmom(+m[2],+m[1]*60,[lab],'Round');
  if((m=H.match(/every\s+minute\s+for\s+(\d+)\s*min/i))||(m=H.match(/emom\s+(\d+)/i))) return gEmom(+m[1],60,[lab]);
  if((m=H.match(/(\d+)\s*(?:sec|s)\s*on\s*\/\s*(\d+):?(\d\d)?\s*(?:sec|s|off)?[^x]*x\s*(\d+)/i))) return gOnOff(+m[4],+m[1],m[3]?+m[2]*60+ +m[3]:+m[2],lab);
  if((m=H.match(/(\d+)\s*x\s*(\d+)\s*min\s*on\s*\/\s*(\d+)\s*sec\s*off/i))){ const o=[]; (lines.length?lines:[lab]).forEach((l,i)=>{ if(i) o.push(GS('Rest — next exercise',60,'rest')); o.push(...gOnOff(+m[1],+m[2]*60,+m[3],l)); }); return o; }
  if((m=H.match(/(\d+)\s*rounds?/i))&&lines.length===2&&/rest/i.test(lines[1])&&gSecs(lines[0])&&gSecs(lines[1])) return gOnOff(+m[1],gSecs(lines[0]),gSecs(lines[1]),lines[0]);
  if(/tabata/i.test(H)||lines.some(l=>/^tabata/i.test(l))){ const o=[]; const tl=lines.filter(l=>/^tabata/i.test(l)); (tl.length?tl:[lab]).forEach((l,i)=>{ if(i) o.push(GS('Rest',60,'rest')); o.push(...gTabata(l.replace(/^tabata\s*/i,''))); }); return o; }
  if((m=H.match(/amrap\s+(\d+)/i))||(m=H.match(/max rounds in (\d+) min/i))||(m=H.match(/(\d+)\s*min of/i))) return [GS('AMRAP — '+lab,+m[1]*60)];
  if((m=H.match(/max .* in (\d+) min/i))) return [GS(lab,+m[1]*60)];
  if((m=H.match(/(\d+)\s*rounds?/i))){ const n=+m[1]; const rest=/1 min rest/i.test(H)?60:/(\d+)\s*min rest/i.test(H)?+H.match(/(\d+)\s*min rest/i)[1]*60:/rest (\d+) min/i.test(H)?+H.match(/rest (\d+) min/i)[1]*60:0; const per=Math.max(60,Math.min(180,lines.length*45)); return gRounds(n,[[lab,per]],rest); }

function hSegs(w){ let out=[]; (w.b||[]).forEach((blk,bi)=>{ let hdr=''; let lines=[]; const flush=()=>{ if(lines.length||(hdr&&/round|min|amrap|for time|tabata|emom|every|\d+-\d+/i.test(hdr))){ if(out.length) out.push(GS('Transition',30,'rest')); out.push(...hSegsForBlock(hdr,lines)); } hdr=''; lines=[]; }; blk.forEach(line=>{ if(line.startsWith('#')){ if(lines.length) flush(); hdr=line.slice(1); } else lines.push(line); }); flush(); }); if(!out.length) out=[GS(w.n,600)]; return out; }

let _idb=null;
function idb(){ return _idb||(_idb=new Promise((res,rej)=>{ try{ const r=indexedDB.open('hpo-photos',1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } })); }
async function idbPut(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const r=db.transaction('p').objectStore('p').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbDel(k){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').delete(k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function idbAll(){ const db=await idb(); return new Promise((res,rej)=>{ const out={}; const r=db.transaction('p').objectStore('p').openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>rej(r.error); }); }
async function idbClear(){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').clear(); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
const PH={}; // in-memory cache id -> dataURL
async function phLoad(ids){ let n=0; await Promise.all(ids.filter(i=>PH[i]===undefined).map(async i=>{ try{ PH[i]=(await idbGet(i))||null; if(PH[i]) n++; }catch(e){ PH[i]=null; } })); return n; }
function phShrink(file,max){ return new Promise(res=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.82)); }; img.onerror=()=>res(null); img.src=u; }); }
async function kaAddPhoto(inp,cap){ const f=inp.files[0]; if(!f) return; const data=await phShrink(f,1000); if(!data){ toast('Could not read that photo'); return; } const d=S.ka.d, x=kaEnsure(d); const id='ka-'+d+'-'+Date.now(); try{ await idbPut(id,data); }catch(e){ toast('Photo storage unavailable'); return; } PH[id]=data; x.photos=x.photos||[]; x.photos.push({id,cap,t:new Date().toISOString()}); if(!x.date) x.date=new Date().toISOString(); save(); render(); }

function histSessions(){ const ev=rptEvents(); return ev; }
function histWeekKey(d){ const dt=new Date(d+'T12:00:00'); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); return localDay(dt); }
function histStreak(dates){ const set=new Set(dates); let n=0; const d=new Date(); for(;;){ const k=localDay(d); if(set.has(k)){ n++; d.setDate(d.getDate()-1); } else if(n===0&&k===todayLocal()){ d.setDate(d.getDate()-1); } else break; } return n; }
function histRunPRs(){ const runs=(S.free||[]).filter(f=>/run/i.test(f.type)&&+f.dist&&f.time); const best={}; runs.forEach(f=>{ const m=String(f.time).match(/^(\d+):(\d\d)(?::(\d\d))?$/); if(!m) return; const sec=m[3]?(+m[1]*3600+ +m[2]*60+ +m[3]):(+m[1]*60+ +m[2]); const key=(+f.dist).toFixed(1)+' '+f.unit; if(!best[key]||sec<best[key].sec) best[key]={sec,f}; }); return best; }

function gapLines(days){ // list of {d, txt} movement-level entries within last N days

async function rptPrep(){ const i=medIssue(); const ev=rptEvents(), today=todayLocal(); const first=ev.length?ev[0].d:today;

  d.phases={}; for(const k in S.ka.days){ if(S.ka.days[k].done){ const p=KA_DAYS[k-1].phase; d.phases[p]=(d.phases[p]||0)+1; } }

  return d; }

  const pts=hist.map(x=>{ let v=0; x.sets.forEach(s=>{ const w=(typeof s.w==='number'?s.w:0),r=+s.r||0; v=Math.max(v, tw&&unit==='reps'?(w&&r?e1rm(w,r):0): tw? w : r); }); return {l:`W${x.week}`,v}; });

function drawChart(pts){
  const c=document.getElementById('chart'); if(!c) return; const ctx=c.getContext('2d'); const W=c.width,H=c.height,pad=34;
  ctx.clearRect(0,0,W,H); if(!pts.length) return;
  const vals=pts.map(p=>p.v), mx=Math.max(...vals)*1.1||1, mn=Math.min(...vals,0);
  const x=i=>pad+(W-pad*2)*(pts.length>1?i/(pts.length-1):.5), y=v=>H-pad-(H-pad*2)*((v-mn)/(mx-mn||1));
  ctx.strokeStyle='#C9CFCC'; ctx.lineWidth=1; [0,.5,1].forEach(f=>{const yy=y(mn+(mx-mn)*f); ctx.beginPath(); ctx.moveTo(pad,yy); ctx.lineTo(W-pad,yy); ctx.stroke(); ctx.fillStyle='#4A5753'; ctx.font='12px sans-serif'; ctx.fillText(Math.round(mn+(mx-mn)*f),4,yy+4);});
  ctx.strokeStyle='#182320'; ctx.lineWidth=3; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(x(i),y(p.v)):ctx.moveTo(x(i),y(p.v))); ctx.stroke();
  let best=-1; pts.forEach((p,i)=>{ if(p.v>=Math.max(...vals)) best=i; });
  pts.forEach((p,i)=>{ ctx.fillStyle=i===best?'#F06A1F':'#182320'; ctx.beginPath(); ctx.arc(x(i),y(p.v),i===best?7:4,0,7); ctx.fill(); ctx.fillStyle='#4A5753'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText(p.l,x(i),H-10); ctx.fillStyle='#182320'; ctx.font='bold 12px sans-serif'; ctx.fillText(Math.round(p.v),x(i),y(p.v)-10); });
}

const FB_REPO='muddledsoul/HPO-Tracker';
const FB_BLOB=''; // GitHub key, locked with the app password. Made in More > Report or request > Admin. Empty = not switched on yet.
const FB_TYPES=['Problem','Fix needed','New feature'];
let FB_DRAFT=null, FB_BUSY=false, FB_MSG='', FB_P=null;
function fbTok(){ try{ return localStorage.getItem(KEY+'-fbtok')||''; }catch(e){ return ''; } }
function fbQ(){ try{ return JSON.parse(localStorage.getItem(KEY+'-fbq')||'[]'); }catch(e){ return []; } }
function fbQSet(q){ try{ localStorage.setItem(KEY+'-fbq',JSON.stringify(q)); }catch(e){} }
function fbB64e(u){ let s=''; u.forEach(c=>s+=String.fromCharCode(c)); return btoa(s); }
function fbB64d(s){ return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function fbKey(pw,salt){ const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function fbSeal(tok,pw){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await fbKey(pw,salt),new TextEncoder().encode(tok))); const out=new Uint8Array(28+ct.length); out.set(salt); out.set(iv,16); out.set(ct,28); return fbB64e(out); }
async function fbOpen(blob,pw){ const b=fbB64d(blob); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},await fbKey(pw,b.slice(0,16)),b.slice(28)); return new TextDecoder().decode(pt); }
async function fbUnlock(pw,quiet){ if(!FB_BLOB) return false; try{ const t=await fbOpen(FB_BLOB,pw); localStorage.setItem(KEY+'-fbtok',t); if(!quiet) fbFlush(); return true; }catch(e){ return false; } }
function fbDevice(){ const u=navigator.userAgent; const d=/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':'Computer'; const st=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone; return d+(st?' (installed)':' (browser)'); }

function fbClose(){ S.tab=(FB_DRAFT&&FB_DRAFT.back)||'home'; render(); window.scrollTo(0,0); }

  const q=fbQ().length, needPw=FB_BLOB&&!fbTok();

async function fbSend(){ const f=FB_DRAFT; if(!f||FB_BUSY) return; const text=(f.text||'').trim();
  if(text.length<5){ FB_MSG='Add a few words first.'; render(); return; }
  FB_BUSY=true; FB_MSG=''; render();
  if(FB_BLOB&&!fbTok()&&(f.pw||'').trim()){ if(!(await fbUnlock(f.pw.trim(),true))){ FB_BUSY=false; FB_MSG='That password did not work. Your request is still here.'; render(); return; } f.pw=''; }
  const first=text.split('\n')[0], nm=(f.name||'').trim();
  const item={title:`[${f.type}] ${first.length>70?first.slice(0,67)+'…':first}`, body:[`**Type:** ${f.type}`,`**From:** ${nm||'not given'}`,`**Screen:** ${f.from}`,`**App version:** ${APP_VERSION}`,`**Device:** ${fbDevice()}`,`**Sent:** ${todayLocal()}`,'',text].join('\n'), at:Date.now()};
  const q=fbQ(); q.push(item); fbQSet(q); try{ localStorage.setItem(KEY+'-fbname',nm); }catch(e){}
  f.text=''; const r=await fbFlush(); FB_BUSY=false;
  FB_MSG=r.sent&&!fbQ().length?'Sent. Thank you, it is on the list.':(r.why||'Saved on this phone. It will send next time the app opens.'); if(S.tab==='fb') render(); }
async function fbFlush(manual){ if(!FB_P) FB_P=fbRun().finally(()=>{ FB_P=null; }); const r=await FB_P; if(manual){ FB_MSG=r.sent?`Sent ${r.sent}.`:r.why; if(S.tab==='fb'||S.tab==='more') render(); } return r; }
async function fbRun(){ if(!fbQ().length) return {sent:0,why:'Nothing waiting.'};
  const tok=fbTok(); if(!tok) return {sent:0,why:FB_BLOB?'Saved on this phone. Enter the app password to send it.':'Saved on this phone. It will send once requests are switched on.'};
  let sent=0, why='';
  for(;;){ const q=fbQ(); if(!q.length) break; const it=q[0]; let res;
      try{ res=await fetch(`https://api.github.com/repos/${FB_REPO}/issues`,{method:'POST',headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({title:it.title,body:it.body})}); }
      catch(e){ why='No connection. Saved on this phone, it will send next time the app opens.'; break; }
      if(res.status===201||res.status===422){ const q2=fbQ(); q2.shift(); fbQSet(q2); if(res.status===201) sent++; else why='GitHub could not read one request, so it was dropped.'; continue; }
      if(res.status===401){ try{ localStorage.removeItem(KEY+'-fbtok'); }catch(e){} why=FB_BLOB?'The saved key was turned down. Enter the app password and send again.':'The GitHub key was turned down. Saved on this phone.'; break; }
      why=(res.status===403||res.status===429)?'GitHub is not taking requests right now. Saved on this phone, it will try again later.':`Could not send (${res.status}). Saved on this phone.`; break; }
  return {sent,why}; }
function fbMore(){ const q=fbQ().length; return `<h2 class="sec">Report or request</h2><p class="help">Found a problem or want something changed? Send it to the app's request list.${q?` ${q} waiting to send.`:''}</p><div class="row"><button class="btn ghost" onclick="fbOpenForm()">Report a problem / request a change</button></div>
<details style="margin-top:10px"><summary class="help" style="cursor:pointer">Admin: connect the request list (${FB_BLOB?'switched on for everyone':fbTok()?'connected on this phone only':'not connected'})</summary><p class="help">Paste a GitHub fine-grained token that can only read and write Issues on ${FB_REPO}. It is locked with the app password before it leaves this phone.</p><div class="hlog" style="grid-template-columns:1fr"><div><label>GitHub token</label><input type="password" id="fbTokIn" autocomplete="off"></div><div><label>App password</label><input type="password" id="fbPwIn" autocomplete="current-password"></div></div><div class="row" style="margin-top:10px"><button class="btn ghost" onclick="fbAdmin()">Connect</button></div><p class="help" id="fbAdminMsg" style="margin-top:8px"></p><textarea class="io" id="fbBlobOut" readonly style="display:none"></textarea><div class="row" id="fbCopyRow" style="display:none;margin-top:8px"><button class="btn ghost" onclick="fbCopy()">Copy code</button></div></details>`; }
async function fbAdmin(){ const tok=document.getElementById('fbTokIn').value.trim(), pw=document.getElementById('fbPwIn').value.trim(), msg=document.getElementById('fbAdminMsg'); const say=m=>{ msg.textContent=m; };
  if(!tok||!pw){ say('Paste the token and enter the app password.'); return; }

  say('Connected on this phone. Send one test request from the form, then copy the code below and give it to Claude to switch it on for everyone.'); fbFlush(); }

function checkUpdate(){ if(!('serviceWorker' in navigator)){ location.reload(); return; } navigator.serviceWorker.getRegistration().then(r=>{ if(!r){ location.reload(); return; } r.update().then(()=>{ setTimeout(()=>{ if(!window.__reloaded){ toast('Up to date'); } },2500); }); }); }
async function exportData(){ toast('Packing backup…'); const o=JSON.parse(JSON.stringify(S)); try{ o.photos=await idbAll(); }catch(e){ o.photos={}; } const t=JSON.stringify(o); try{ const b=new Blob([t],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='hpo-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); toast(`Backup ready (${Object.keys(o.photos).length} photos)`); }catch(e){ const ta=document.getElementById('expText'); ta.style.display='block'; ta.value=t; ta.select(); toast('Select and copy the text'); } }
function importFile(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ document.getElementById('impText').value=r.result; importData(); }; r.readAsText(f); }
async function importData(){ try{ const o=JSON.parse(document.getElementById('impText').value); if(!o.sessions) throw 0; const ph=o.photos||{}; delete o.photos; Object.assign(S,o); let n=0; for(const k in ph){ try{ await idbPut(k,ph[k]); PH[k]=ph[k]; n++; }catch(e){} } save(); render(); toast('Restored'+(n?' with '+n+' photos':'')); }catch(e){ toast('That backup could not be read'); } }


const PW_SALT='l5faQcuqaDQZ8zwbzkg5jg==', PW_ITER=1000000, PW_HASH='8157956e01a4202e72ce638fbc4f27a4072b861b6a22c07b587c42e1eb6722df';
async function pwCheck(v){ try{ const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(v),'PBKDF2',false,['deriveBits']); const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(PW_SALT),c=>c.charCodeAt(0)),iterations:PW_ITER,hash:'SHA-256'},k,256); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===PW_HASH; }catch(e){ return false; } }
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function unlock(e){e.preventDefault();const v=document.getElementById('pw').value.trim();document.getElementById('pwerr').textContent='Checking…';if(await pwCheck(v)){try{localStorage.setItem(KEY+'-unlocked',String(Date.now()));}catch(x){}document.getElementById('gate').remove();fbUnlock(v);}else{document.getElementById('pwerr').textContent='Nope.';document.getElementById('pw').value='';}return false;}
function lock(){try{localStorage.removeItem(KEY+'-unlocked');if(FB_BLOB)localStorage.removeItem(KEY+'-fbtok');}catch(x){}location.reload();}
(function(){try{const t=+localStorage.getItem(KEY+'-unlocked')||0;if(t&&Date.now()-t<2*3600*1000){localStorage.setItem(KEY+'-unlocked',String(Date.now()));document.getElementById('gate').remove();}}catch(x){}})();
load();
